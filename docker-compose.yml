# VPS stack: Headscale (coordination) + Caddy (TLS edge). Identity is provided
# by an external Authentik IdP on a separate host; this stack only consumes it.
# Run ./setup.sh (after copying .env.example to .env) to render configs.

# Separate parts live in their own directories and are pulled in here so they
# share this project's network, Caddy and update/backup tooling. Each one gates
# its services behind a compose profile, switched in .env via COMPOSE_PROFILES.
include:
  - live/docker-compose.yml   # MediaMTX streaming; profile "live", on by default

services:
  caddy:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    ports:
      - "80:80"      # ACME HTTP-01 + redirect
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro   # rendered by setup.sh
      - ./caddy/sites:/etc/caddy/sites:ro           # optional parts' sites, rendered by setup.sh
      - caddy-data:/data        # certificates live here — do not delete
      - caddy-config:/config

  headscale:
    image: headscale/headscale:v0.29@sha256:cabe84f0699913dbca9320f0883dca7565dd08df3c5be29edfabbebeff763966     # pin to a release; see README
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      - caddy
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale

volumes:
  caddy-data:
  caddy-config:
  headscale-data:
