# VPS stack: Headscale (coordination) + Caddy (TLS edge). Identity is provided
# by an external Authentik IdP on a separate host; this stack only consumes it.
# Run ./setup.sh (after copying .env.example to .env) to render configs.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"      # ACME HTTP-01 + redirect
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro   # rendered by setup.sh
      - caddy-data:/data        # certificates live here — do not delete
      - caddy-config:/config

  headscale:
    image: headscale/headscale:0.26     # pin to a release; see README
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      - caddy
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale

volumes:
  caddy-data:
  caddy-config:
  headscale-data:
