# live: MediaMTX streaming server + its control panel, a separate part of the
# iroha stack. Included from ../docker-compose.yml, so it shares iroha's
# project, network and Caddy, and ops/update.sh updates it with the rest. Every
# service is in the "live" profile, which .env.example enables by default
# (COMPOSE_PROFILES=live); drop it there to turn streaming off (see README).

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4@sha256:c730bccdbc8739f8f0c13cefe9bea8b61926f599b88fa4d0d229baa91846c7bc
    profiles: ["live"]
    restart: unless-stopped
    ports:
      - "1935:1935"        # RTMP ingest from OBS
      - "554:8554"         # RTSP output for VRChat (rtspt://<LIVE_HOST>/<key>)
      - "8189:8189/udp"    # WebRTC media (ICE UDP)
      - "8189:8189/tcp"    # WebRTC media fallback (ICE TCP)
      - "127.0.0.1:9997:9997"  # control API, local only (Caddy reaches it as mediamtx:9997)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro   # rendered by setup.sh

  panel:
    image: nginx:alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    profiles: ["live"]
    restart: unless-stopped
    volumes:
      - ./panel:/usr/share/nginx/html:ro

  # Per-user stream keys: MediaMTX's auth hook (:8000, internal only) and the
  # panel's key API (:8001, via Caddy forward auth). See keys/keys.py.
  keys:
    image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    profiles: ["live"]
    restart: unless-stopped
    command: ["python", "-I", "/app/keys.py"]
    environment:
      AUTHENTIK_URL: "https://${ID_HOST}"
      AUTHENTIK_TOKEN: "${LIVE_AUTHENTIK_TOKEN}"
      AUTHENTIK_GROUP: streamers
    volumes:
      - ./keys/keys.py:/app/keys.py:ro
      - live-keys:/data        # keys.json: the stream keys; back it up
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  live-keys:
