# live: MediaMTX streaming server + its control panel, a separate part of the
# iroha stack. Included from ../docker-compose.yml, so it shares iroha's
# project, network and Caddy, and ops/update.sh updates it with the rest. Every
# service is in the "live" profile, which .env.example enables by default
# (COMPOSE_PROFILES=live); drop it there to turn streaming off (see README).

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3@sha256:59e43552f3be43695b70c19424dc2a42fcec18075f88d91561a24ac5d70a586c
    profiles: ["live"]
    restart: unless-stopped
    ports:
      - "1935:1935"        # RTMP ingest from OBS
      - "554:8554"         # RTSP output for VRChat (rtspt://<LIVE_HOST>/<key>)
      - "8189:8189/udp"    # WebRTC media (ICE UDP)
      - "8189:8189/tcp"    # WebRTC media fallback (ICE TCP)
      - "127.0.0.1:9997:9997"  # control API, local only (Caddy reaches it as mediamtx:9997)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro   # rendered by setup.sh

  panel:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    profiles: ["live"]
    restart: unless-stopped
    volumes:
      - ./panel:/usr/share/nginx/html:ro
